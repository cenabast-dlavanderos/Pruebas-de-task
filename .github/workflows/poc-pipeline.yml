name: PoC CI/CD Pipeline - CENABAST (Linux Stack)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, ubuntu]

    steps:
      - name: 1. Checkout del Código Fuente
        uses: actions/checkout@v4

      - name: 2. Verificación del Entorno
        run: |
          echo "==== Verificando Entorno de Construcción CENABAST ===="
          echo "Usuario ejecutor: $(whoami)"
          echo "Directorio de trabajo: $(pwd)"
          echo "Versión de Git: $(git --version)"
          node -v || echo "Node.js no instalado aún"
          python3 --version || echo "Python3 no instalado aún"

      - name: 3. Simulación de Pruebas Unitarias
        run: |
          echo "Running unit tests..."
          sleep 2
          echo "✓ All tests passed successfully!"

      - name: 4. Resumen de Ejecución
        run: echo "Pipeline completado con éxito en el Runner Self-Hosted!"
