docker-ghcr:
    runs-on: [self-hosted, linux, ubuntu]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4

      # ─── AGREGAR ESTOS DOS PASOS NUEVOS ───
      - name: 2. Configurar QEMU (Soporte multiplataforma)
        uses: docker/setup-qemu-action@v3

      - name: 3. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      # ───────────────────────────────────────

      - name: 4. Autenticación en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Construcción y Publicación de la Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pruebas-de-task:latest
            ghcr.io/${{ github.repository_owner }}/pruebas-de-task:${{ github.sha }}