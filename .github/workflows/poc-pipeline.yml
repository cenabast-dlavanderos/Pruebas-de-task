name: PoC CI/CD Pipeline - CENABAST

on:
  push:
    branches: [ "main", "master" ]

jobs:
  docker-ghcr:
    runs-on: [self-hosted, linux, ubuntu]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4

      - name: 2. Autenticación en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Construcción de la Imagen
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pruebas-de-task:latest .

      - name: 4. Publicación en GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pruebas-de-task:latest

  sonarcloud-analysis:
    runs-on: [self-hosted, linux, ubuntu]
    steps:
      - name: 1. Checkout del Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Análisis de Código con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-dotnet-windows:
    runs-on: [self-hosted, windows, iis]
    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4

      - name: 2. Verificación del Entorno Windows / IIS / .NET
        shell: powershell
        run: |
          Write-Host "==== Verificando Entorno Windows CENABAST ====" -ForegroundColor Green
          Write-Host "Nombre del Host: $env:COMPUTERNAME"
          Write-Host "Versión de PowerShell: $PSVersionTable.PSVersion"
          Get-Service -Name "W3SVC" -ErrorAction SilentlyContinue || Write-Host "Servicio IIS disponible o listo para integración"

      - name: 3. Simulación de Compilación .NET Framework + Conector SAP
        shell: powershell
        run: |
          Write-Host "Compilando solución .NET Framework / Core para IIS..." -ForegroundColor Yellow
          Start-Sleep -Seconds 2
          Write-Host "✓ Ensamblado completado con éxito. DLLs de SAP vinculadas correctamente." -ForegroundColor Green